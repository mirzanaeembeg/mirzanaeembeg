name: Update GitHub Streak SVG

on:
  schedule:
    - cron: '0 0 * * *' # every day at 00:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-streak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Fetch streak SVG
        run: |
          STREAK_URL='https://github-readme-streak-stats-naeem-beg.vercel.app/?user=mirzanaeembeg&theme=tokyonight&hide_border=false'
          OUT=assets/streak.svg
          mkdir -p assets
          curl -fsSL "$STREAK_URL" -o "$OUT.tmp" || (echo "Failed to download streak SVG" && exit 1)
          # Basic validation: ensure the file contains an SVG tag
          if ! grep -q '<svg' "$OUT.tmp"; then
            echo "Downloaded file doesn't look like SVG; aborting"
            rm "$OUT.tmp"
            exit 1
          fi
          if [ -f "$OUT" ]; then
            if cmp -s "$OUT" "$OUT.tmp"; then
              echo "No changes in streak SVG; nothing to commit"
              rm "$OUT.tmp"
              exit 0
            fi
          fi
          mv "$OUT.tmp" "$OUT"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/streak.svg
          git commit -m "chore: update GitHub streak SVG (daily)" || echo "No changes to commit"
          git push
